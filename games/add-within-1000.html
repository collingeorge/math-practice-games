<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add It Up: Addition Within 1,000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #DDF1FA; --card: #FFFFFF; --ink: #1F2A44; --soft-ink: #4A5878;
    --sun: #FFC93C; --grape: #6C4AB6; --grape-ink: #FFFFFF;
    --leaf: #1E7A43; --leaf-bg: #DDF5E6; --berry: #C13560; --berry-bg: #FCE3EA;
    --dot: #B9D7E6; --btn: #FFFFFF; --btn-border: #1F2A44;
    --th-col: #F3E8FF; --h-col: #E3F1FB; --t-col: #E2F6E9; --o-col: #FFEEDF;
    --flat: #3BA6E8; --rod: #3FB86A; --unit: #FF8A3D; --block-line: #1F2A44;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #14213A; --card: #1E2E4D; --ink: #F1F5FF; --soft-ink: #B8C4E0;
      --grape: #A98BF0; --grape-ink: #14213A;
      --leaf: #5FD68E; --leaf-bg: #173D2A; --berry: #FF7FA0; --berry-bg: #4A1F2C;
      --dot: #34466B; --btn: #263A60; --btn-border: #B8C4E0;
      --th-col: #2C2550; --h-col: #1B3552; --t-col: #1B3D33; --o-col: #3D2E22;
      --block-line: #14213A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sky: #14213A; --card: #1E2E4D; --ink: #F1F5FF; --soft-ink: #B8C4E0;
    --grape: #A98BF0; --grape-ink: #14213A;
    --leaf: #5FD68E; --leaf-bg: #173D2A; --berry: #FF7FA0; --berry-bg: #4A1F2C;
    --dot: #34466B; --btn: #263A60; --btn-border: #B8C4E0;
    --th-col: #2C2550; --h-col: #1B3552; --t-col: #1B3D33; --o-col: #3D2E22;
    --block-line: #14213A;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%; background: var(--sky); color: var(--ink);
    font-family: "Andika", "Century Gothic", "Trebuchet MS", system-ui, sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 640px; padding: 16px 14px 32px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: clamp(1.4rem, 4.5vw, 2rem); margin: 0; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .streak { font-weight: 700; font-size: 1.05rem; }
  .pill {
    font: inherit; font-size: 1rem; background: var(--btn); color: var(--ink);
    border: 2px solid var(--btn-border); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }

  .track { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .track span { width: 13px; height: 13px; border-radius: 50%; background: var(--dot); }
  .track span.done { background: var(--leaf); }
  .track span.retry { background: var(--sun); }
  .track span.now { outline: 3px solid var(--grape); outline-offset: 1px; }

  .card { background: var(--card); border-radius: 26px; padding: 16px 12px 20px; }
  .prompt { font-size: clamp(1.2rem, 4.6vw, 1.6rem); text-align: center; margin: 0 0 12px; min-height: 1.4em; font-weight: 700; }

  /* the vertical problem */
  .problem {
    display: grid; grid-template-columns: 2.2rem repeat(4, minmax(0, 4.4rem));
    justify-content: center; column-gap: 6px; row-gap: 4px; margin: 0 auto;
    font-weight: 700;
  }
  .problem .hd { text-align: center; font-size: .85rem; border-radius: 10px 10px 0 0; padding: 4px 0; }
  .problem .d { text-align: center; font-size: clamp(2.2rem, 10vw, 3rem); line-height: 1.25; }
  .problem .op { text-align: center; font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1.3; align-self: center; }
  .problem .bar { grid-column: 1 / -1; height: 5px; background: var(--ink); border-radius: 3px; margin: 2px 0 6px; }
  .problem .th { background: var(--th-col); } .problem .h { background: var(--h-col); }
  .problem .t { background: var(--t-col); } .problem .o { background: var(--o-col); }
  .problem .gone { visibility: hidden; }
  .problem .hot { box-shadow: inset 0 0 0 3px var(--grape); }

  .box {
    margin: 0 auto; text-align: center; border: 3px dashed var(--soft-ink); border-radius: 12px;
    background: var(--card); color: var(--soft-ink);
  }
  .box.carry { width: 2.2rem; height: 2.2rem; font-size: 1.4rem; line-height: 1.9rem; margin-top: 4px; margin-bottom: 4px; }
  .box.ans { width: 92%; font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.3; min-height: 1.4em; }
  .box.active { border-style: solid; border-color: var(--grape); box-shadow: 0 0 0 4px var(--grape); color: var(--ink); }
  .box.done { border-style: solid; border-color: var(--leaf); background: var(--leaf-bg); color: var(--leaf); }
  .box.wait { opacity: .55; }
  .carry-spacer { height: 2.2rem; margin: 4px 0; }

  /* keypad */
  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 460px; margin: 18px auto 0; }
  .key {
    font: inherit; font-weight: 700; font-size: clamp(1.6rem, 7vw, 2.2rem);
    background: var(--btn); color: var(--ink); border: 3px solid var(--btn-border);
    border-radius: 16px; padding: 8px 0; cursor: pointer;
  }
  .key.wide { grid-column: span 2; font-size: 1.3rem; }
  .key.go { grid-column: span 3; background: var(--grape); color: var(--grape-ink); border-color: var(--grape); font-size: 1.4rem; }
  .eraser { width: 1.7em; height: 1.1em; vertical-align: middle; margin-right: 4px; }
  button:disabled { cursor: default; opacity: .6; }
  button:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }

  /* corrective feedback */
  .fix { margin-top: 16px; padding: 14px 10px; border-radius: 20px; border: 3px dashed var(--sun); }
  .fix-text { font-size: clamp(1.1rem, 4vw, 1.3rem); text-align: center; margin: 0 0 10px; }
  .fix-eq { text-align: center; font-weight: 700; font-size: clamp(1.4rem, 6vw, 1.9rem); margin: 0 0 10px; }
  .pieces { --u: 9px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 14px; }
  .pieces.tens { --u: 7px; }
  .pieces.hundreds { --u: 3.4px; }
  .grp { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .7); align-items: flex-end; justify-content: center; max-width: 100%; }
  .grp.units { display: grid; grid-template-columns: repeat(5, var(--u)); gap: calc(var(--u) * .45); }
  .trade { border: 3px dashed var(--grape); border-radius: 12px; padding: 8px 8px 4px; text-align: center; }
  .trade .lab, .rest .lab { font-size: .95rem; font-weight: 700; margin-top: 6px; }
  .trade .lab { color: var(--grape); }
  .rest { text-align: center; padding: 8px 4px 4px; }
  .flat { width: calc(var(--u) * 10); height: calc(var(--u) * 10); }
  .rod { width: var(--u); height: calc(var(--u) * 10); }
  .unit { width: var(--u); height: var(--u); }

  .feedback { min-height: 1.6em; margin-top: 14px; text-align: center; font-size: clamp(1.15rem, 4vw, 1.4rem); }
  .feedback.good { color: var(--leaf); font-weight: 700; }
  .feedback.try { color: var(--berry); }
  .next {
    font: inherit; font-weight: 700; font-size: 1.4rem; display: block; margin: 10px auto 0;
    background: var(--grape); color: var(--grape-ink); border: none; border-radius: 999px; padding: 12px 36px; cursor: pointer;
  }
  .hidden { display: none !important; }
  .end { text-align: center; padding: 30px 10px; }
  .end .big { font-size: clamp(3rem, 14vw, 5rem); margin: 0; }
  .end p { font-size: 1.4rem; }
  .home-link { display: inline-block; font: inherit; font-weight: 700; color: var(--ink); text-decoration: none; background: var(--btn); border: 2px solid var(--btn-border); border-radius: 999px; padding: 6px 14px; margin-bottom: 10px; min-height: 40px; }
  .home-link:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <a class="home-link" href="../math.html"><span aria-hidden="true">←</span> Math Games</a>
  <header>
    <h1>Add it up</h1>
    <div class="tools">
      <span class="streak" id="streak" aria-live="polite"></span>
      <button type="button" class="pill" id="soundBtn" aria-pressed="true">🔊 Sound on</button>
    </div>
  </header>

  <div class="track" id="track" aria-hidden="true"></div>

  <div class="card" id="game">
    <p class="prompt" id="prompt"></p>
    <div class="problem" id="problem"></div>
    <div id="keypad"></div>
    <div class="fix hidden" id="fix"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button type="button" class="next hidden" id="nextBtn">Next</button>
  </div>

  <section class="card end hidden" id="end">
    <p class="big">🧮</p>
    <h2 id="endTitle">All done!</h2>
    <p id="score"></p>
    <button type="button" class="next" id="againBtn">Play again</button>
  </section>
</main>

<script>
(function () {
  // ---- Settings: problems get harder in stages ----
  //   ones / tens: whether that column regroups
  //   special: "zero" = a 0 in the tens place of the top number (like 305 + 498)
  //            "1000" = the answer is exactly 1,000
  //   twoDigitShare: how often the bottom number has only 2 digits
  const STAGES = [
    { n: 5, ones: false, tens: false, twoDigitShare: 0.3 },
    { n: 7, ones: true,  tens: false, twoDigitShare: 0.3 },
    { n: 6, ones: false, tens: true,  twoDigitShare: 0.2 },
    { n: 7, ones: true,  tens: true,  twoDigitShare: 0.15 },
    { n: 3, special: "zero" },
    { n: 2, special: "1000" }
  ];
  const TOTAL = STAGES.reduce((a, s) => a + s.n, 0);   // 30

  const PLACES = ["ones", "tens", "hundreds", "thousands"];
  const ONE = ["one", "ten", "hundred", "thousand"];
  const CLS = ["o", "t", "h", "th"];

  const $ = (id) => document.getElementById(id);
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  let soundOn = true;
  function say(text) {
    if (!soundOn || !("speechSynthesis" in window)) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; speechSynthesis.speak(u); } catch (e) {}
  }

  // ---- Problem generation ----
  const dig = (n, i) => Math.floor(n / 10 ** i) % 10;

  function makeProblem(st) {
    for (;;) {
      let a, b;
      if (st.special === "1000") {
        a = rnd(101, 899); if (a % 10 === 0) continue;
        b = 1000 - a;
        return { a, b };
      }
      const two = !st.special && Math.random() < (st.twoDigitShare || 0);
      a = rnd(1, 8) * 100 + (st.special === "zero" ? 0 : rnd(0, 9) * 10) + rnd(0, 9);
      b = (two ? 0 : rnd(1, 8) * 100) + rnd(two ? 1 : 0, 9) * 10 + rnd(0, 9);
      const c0 = dig(a, 0) + dig(b, 0) >= 10 ? 1 : 0;
      const c1 = dig(a, 1) + dig(b, 1) + c0 >= 10 ? 1 : 0;
      const wantOnes = st.special === "zero" ? true : st.ones;
      const wantTens = st.special === "zero" ? true : st.tens;
      if (!!c0 !== wantOnes || !!c1 !== wantTens) continue;
      if (a + b >= 1000) continue;
      return { a, b };
    }
  }

  // The order a student fills boxes in: ones answer, regroup box, tens answer, ...
  function makeSteps(a, b) {
    const steps = [];
    const sum = a + b;
    let carry = 0;
    for (let c = 0; c < 3; c++) {
      const total = dig(a, c) + dig(b, c) + carry;
      const isLast = c === 2 || (a < 10 ** (c + 1) && b < 10 ** (c + 1) && total < 10 && sum < 10 ** (c + 1));
      steps.push({ kind: "ans", col: c, val: total % 10, aD: dig(a, c), bD: dig(b, c), cin: carry, total });
      carry = total >= 10 ? 1 : 0;
      if (carry && c < 2) steps.push({ kind: "carry", col: c + 1, val: 1, fromCol: c, total });
      if (isLast && !carry) break;
    }
    if (carry) steps.push({ kind: "ans", col: 3, val: 1, aD: 0, bD: 0, cin: 1, total: 1 });
    return steps;
  }

  function buildRounds() {
    const all = [];
    STAGES.forEach((st) => {
      for (let i = 0; i < st.n; i++) {
        const p = makeProblem(st);
        all.push({ ...p, steps: makeSteps(p.a, p.b) });
      }
    });
    return all;
  }

  // ---- Blocks for feedback ----
  const gridPath = (() => { let d = ""; for (let i = 10; i < 100; i += 10) d += `M${i} 0V100M0 ${i}H100`; return d; })();
  const rodPath = (() => { let d = ""; for (let i = 10; i < 100; i += 10) d += `M0 ${i}H10`; return d; })();
  const PIECE = [
    `<svg class="unit" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" style="fill:var(--unit);stroke:var(--block-line);stroke-width:1.2"/></svg>`,
    `<svg class="rod" viewBox="0 0 10 100" preserveAspectRatio="none" aria-hidden="true"><rect width="10" height="100" style="fill:var(--rod);stroke:var(--block-line);stroke-width:1.2"/><path d="${rodPath}" style="stroke:var(--block-line);stroke-width:.8;opacity:.55"/></svg>`,
    `<svg class="flat" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" style="fill:var(--flat);stroke:var(--block-line);stroke-width:2"/><path d="${gridPath}" style="stroke:var(--block-line);stroke-width:.8;opacity:.55"/></svg>`
  ];
  const rep = (s, k) => Array(k).fill(s).join("");
  const plural = (k, c) => `${k} ${k === 1 ? ONE[c] : PLACES[c]}`;

  function piecesHTML(c, total) {
    const piece = PIECE[Math.min(c, 2)];
    const grpCls = c === 0 ? "grp units" : "grp";
    const wrapCls = "pieces" + (c === 2 ? " hundreds" : c === 1 ? " tens" : "");
    if (total < 10) return `<div class="${wrapCls}"><div class="rest"><div class="${grpCls}">${rep(piece, total)}</div><div class="lab">${plural(total, c)}</div></div></div>`;
    return `<div class="${wrapCls}">
      <div class="trade"><div class="${grpCls}">${rep(piece, 10)}</div><div class="lab">10 ${PLACES[c]} = 1 ${ONE[c + 1]}</div></div>
      ${total > 10 ? `<div class="rest"><div class="${grpCls}">${rep(piece, total - 10)}</div><div class="lab">${plural(total - 10, c)} left</div></div>` : `<div class="rest"><div class="lab">0 ${PLACES[c]} left</div></div>`}
    </div>`;
  }

  // ---- State ----
  let rounds = [], index = 0, firstTry = 0, streak = 0, missed = false, solved = false;
  let stepIdx = 0, typed = "", missedStep = false, entered = {};

  function drawTrack() { $("track").innerHTML = rounds.map((r, i) => `<span class="${r.result || ""} ${i === index ? "now" : ""}"></span>`).join(""); }
  function drawStreak() { $("streak").textContent = streak >= 2 ? `🔥 ${streak} in a row` : ""; }
  function setFeedback(t, cls) { const f = $("feedback"); f.textContent = t; f.className = "feedback" + (cls ? " " + cls : ""); }

  function drawProblem() {
    const r = rounds[index];
    const steps = r.steps;
    const cur = solved ? null : steps[stepIdx];
    const usedCols = Math.max(...steps.map((s) => s.col)) + 1;   // 3 or 4
    const colOrder = [3, 2, 1, 0];
    const hot = (c) => cur && cur.col === c ? " hot" : "";
    const show = (c) => c < usedCols;
    const boxFor = (kind, c) => {
      const i = steps.findIndex((s) => s.kind === kind && s.col === c);
      if (i < 0) return null;
      const key = `${kind}${c}`;
      if (entered[key] !== undefined) return `<div class="box ${kind} done">${entered[key]}</div>`;
      if (i === stepIdx && !solved) return `<div class="box ${kind} active" id="display">${typed || ""}</div>`;
      return `<div class="box ${kind} wait"></div>`;
    };
    let h = "";
    // headings
    h += `<div></div>` + colOrder.map((c) => `<div class="hd ${CLS[c]}${show(c) ? "" : " gone"}${hot(c)}">${PLACES[c]}</div>`).join("");
    // regroup row
    h += `<div></div>` + colOrder.map((c) => {
      if (!show(c)) return `<div class="gone"></div>`;
      const b = boxFor("carry", c);
      return `<div class="${CLS[c]}${hot(c)}">${b || `<div class="carry-spacer"></div>`}</div>`;
    }).join("");
    // top number
    const digitCell = (n, c) => {
      if (!show(c)) return `<div class="gone"></div>`;
      const visible = n >= 10 ** c || c === 0;
      return `<div class="d ${CLS[c]}${hot(c)}">${visible ? dig(n, c) : ""}</div>`;
    };
    h += `<div></div>` + colOrder.map((c) => digitCell(r.a, c)).join("");
    h += `<div class="op">+</div>` + colOrder.map((c) => digitCell(r.b, c)).join("");
    h += `<div class="bar"></div>`;
    // answer row
    h += `<div></div>` + colOrder.map((c) => {
      if (!show(c)) return `<div class="gone"></div>`;
      const b = boxFor("ans", c);
      return `<div class="${CLS[c]}${hot(c)}" style="padding:4px 0; border-radius:0 0 10px 10px">${b || ""}</div>`;
    }).join("");
    $("problem").innerHTML = h;
    $("problem").setAttribute("aria-label", `${r.a} plus ${r.b}`);
  }

  function promptFor(step) {
    if (!step) return "";
    if (step.kind === "carry") return `Regroup: how many ${PLACES[step.col]} move to the ${PLACES[step.col]} column?`;
    if (step.col === 3) return "Write the thousands.";
    return `Add the ${PLACES[step.col]}.`;
  }

  const ERASER = `<svg class="eraser" viewBox="0 0 52 32" aria-hidden="true"><g transform="rotate(-18 26 16)"><rect x="4" y="8" width="44" height="17" rx="4" fill="#F7A1B8" stroke="#1F2A44" stroke-width="2.5"/><rect x="4" y="8" width="15" height="17" rx="4" fill="#5B8DEF" stroke="#1F2A44" stroke-width="2.5"/></g></svg>`;
  function drawKeypad() {
    const keys = [1,2,3,4,5,6,7,8,9,0].map((d) => `<button type="button" class="key" data-d="${d}">${d}</button>`).join("");
    $("keypad").innerHTML = `<div class="keypad">${keys}<button type="button" class="key wide" data-act="del" aria-label="Erase">${ERASER}Erase</button><button type="button" class="key go" data-act="check">Check</button></div>`;
  }

  function showRound() {
    const r = rounds[index];
    missed = false; solved = false; stepIdx = 0; typed = ""; missedStep = false; entered = {};
    $("fix").classList.add("hidden"); $("fix").innerHTML = "";
    $("nextBtn").classList.add("hidden");
    setFeedback("");
    drawKeypad(); drawProblem();
    $("prompt").textContent = promptFor(r.steps[0]);
    drawTrack(); drawStreak();
    say(`${r.a} plus ${r.b}. Start with the ones.`);
  }

  // ---- Corrective feedback ----
  function showFix(step, guess) {
    const c = step.col;
    let text = "", eq = "", pics = "";
    if (step.kind === "carry") {
      text = `You made ${plural(step.total, step.fromCol)}. 10 ${PLACES[step.fromCol]} make 1 ${ONE[c]}, so 1 ${ONE[c]} moves to the ${PLACES[c]} column. Write 1 in the regroup box.`;
      pics = piecesHTML(step.fromCol, step.total);
    } else if (c === 3) {
      text = `You regrouped 10 hundreds into 1 thousand. Write 1 in the thousands place.`;
    } else {
      const parts = [step.aD, step.bD].concat(step.cin ? [step.cin] : []);
      eq = `${parts.join(" + ")} = ${step.total}`;
      const g = Number(guess);
      if (guess.length > 1 && g === step.total && step.total >= 10) {
        text = `You wrote the whole ${step.total}, but only one digit fits in the ${PLACES[c]} place. ${step.total} ${PLACES[c]} = 1 ${ONE[c + 1]} and ${plural(step.total - 10, c)}. Write ${step.val} here. The 1 ${ONE[c + 1]} moves next door.`;
      } else if (step.cin && g === (step.aD + step.bD) % 10) {
        text = `Don't forget the 1 you regrouped at the top! ${eq}. Write ${step.val}.`;
      } else if (step.total >= 10) {
        text = `Add the ${PLACES[c]}: ${eq} ${PLACES[c]}. That's 1 ${ONE[c + 1]} and ${plural(step.total - 10, c)}. Write ${step.val} in the ${PLACES[c]} place.`;
      } else {
        text = `Add the ${PLACES[c]}: ${eq} ${PLACES[c]}. Write ${step.val}.`;
      }
      pics = piecesHTML(c, step.total);
    }
    $("fix").innerHTML = (eq ? `<p class="fix-eq">${eq}</p>` : "") + `<p class="fix-text">${text}</p>` + pics;
    $("fix").classList.remove("hidden");
    say(text.replace(/\+/g, " plus ").replace(/=/g, " equals "));
  }

  // ---- Checking ----
  function check() {
    const r = rounds[index];
    if (solved || !typed) return;
    const step = r.steps[stepIdx];
    if (typed === String(step.val)) {
      entered[`${step.kind}${step.col}`] = step.val;
      typed = ""; missedStep = false;
      $("fix").classList.add("hidden");
      stepIdx++;
      if (stepIdx >= r.steps.length) return win();
      const nx = r.steps[stepIdx];
      $("prompt").textContent = promptFor(nx);
      if (step.kind === "ans" && step.total >= 10 && nx.kind === "carry") {
        setFeedback(`Yes! ${step.total} ${PLACES[step.col]} is 1 ${ONE[step.col + 1]} and ${plural(step.total - 10, step.col)}. Time to regroup.`, "good");
        say("Yes! Time to regroup.");
      } else {
        setFeedback("Yes!", "good");
      }
      drawProblem();
      return;
    }
    const guess = typed;
    typed = "";
    drawProblem();
    if (missedStep) { setFeedback("Not yet. Look at the help below and try again.", "try"); say("Not yet. Try again."); return; }
    missed = true; missedStep = true;
    setFeedback("Not quite. Look at the help, then try again.");
    showFix(step, guess);
  }

  function win() {
    const r = rounds[index];
    solved = true;
    if (!missed) { firstTry++; streak++; r.result = "done"; } else { streak = 0; r.result = "retry"; }
    drawProblem();
    $("prompt").textContent = `${r.a} + ${r.b} = ${r.a + r.b}`;
    const cheer = missed ? "Yes, now you've got it!" : ["Yes!", "You got it!", "Great adding!", "That's right!", "Super!"][rnd(0, 4)];
    setFeedback(cheer, "good");
    say(`${cheer} ${r.a} plus ${r.b} equals ${r.a + r.b}.`);
    $("keypad").querySelectorAll("button").forEach((b) => (b.disabled = true));
    $("nextBtn").classList.remove("hidden"); $("nextBtn").focus();
    drawTrack(); drawStreak();
  }

  function maxLen() { const s = rounds[index].steps[stepIdx]; return s && s.kind === "ans" && s.col < 3 ? 2 : 1; }
  function updateDisplay() { const d = $("display"); if (d) d.textContent = typed; }
  function addDigit(d) { if (typed.length < maxLen()) { typed += d; updateDisplay(); } }

  // ---- Events ----
  $("keypad").addEventListener("click", (e) => {
    const key = e.target.closest(".key");
    if (!key || solved) return;
    if (key.dataset.d !== undefined) addDigit(key.dataset.d);
    else if (key.dataset.act === "del") { typed = typed.slice(0, -1); updateDisplay(); }
    else if (key.dataset.act === "check") check();
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.id === "soundBtn" || e.target.id === "hearBtn") return;
    if (solved) { if (e.key === "Enter" && !$("nextBtn").classList.contains("hidden")) { e.preventDefault(); $("nextBtn").click(); } return; }
    if (/^[0-9]$/.test(e.key)) addDigit(e.key);
    else if (e.key === "Backspace") { typed = typed.slice(0, -1); updateDisplay(); }
    else if (e.key === "Enter") { e.preventDefault(); check(); }
  });
  $("nextBtn").addEventListener("click", () => {
    index++;
    if (index >= TOTAL) return finish();
    showRound(); window.scrollTo({ top: 0 });
  });
  $("againBtn").addEventListener("click", start);
  $("soundBtn").addEventListener("click", (e) => {
    soundOn = !soundOn;
    e.currentTarget.textContent = soundOn ? "🔊 Sound on" : "🔇 Sound off";
    e.currentTarget.setAttribute("aria-pressed", String(soundOn));
    if (!soundOn && "speechSynthesis" in window) speechSynthesis.cancel();
  });

  function finish() {
    $("game").classList.add("hidden"); $("end").classList.remove("hidden"); $("nextBtn").classList.add("hidden");
    index = TOTAL; drawTrack();
    $("endTitle").textContent = `You solved all ${TOTAL} problems!`;
    $("score").textContent = `${firstTry} out of ${TOTAL} with no mistakes.`;
    say(`You solved all ${TOTAL} problems!`);
  }
  function start() {
    rounds = buildRounds(); index = 0; firstTry = 0; streak = 0;
    $("end").classList.add("hidden"); $("game").classList.remove("hidden");
    showRound();
  }
  start();
})();
</script>
</body>
</html>
